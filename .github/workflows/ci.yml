name: Darukaa.Earth Continuous Integration

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend TypeScript Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

      - name: Build
        run: npm run build

  backend-check:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GDAL & GEOS
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Geospatial Tests
        run: |
          pytest backend/tests/test_geospatial.py -v
